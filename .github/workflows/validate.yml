name: Validate routes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test the tools
        run: python -m unittest discover -s tools
      - name: Check the route files
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python tools/validate.py ${BASE_REF:+--base "origin/$BASE_REF"}
